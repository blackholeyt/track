<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Minimal Tracker</p>
          <h1>Fitness Planner</h1>
        </div>
      </header>

      <main class="grid">
        <section class="card">
          <h2>Übungen</h2>
          <form id="exercise-form">
            <div class="input-row">
              <input
                id="exercise-name"
                type="text"
                placeholder="Bench Press"
                maxlength="40"
                autocomplete="off"
                required
              />
              <button type="submit">Hinzufügen</button>
            </div>
          </form>
          <ul id="exercise-list"></ul>
        </section>

        <section class="card">
          <h2>Trainings-Tage</h2>
          <form id="day-form">
            <div class="input-row">
              <input
                id="day-name"
                type="text"
                placeholder="Push"
                maxlength="30"
                autocomplete="off"
                required
              />
              <button type="submit" class="secondary">Erstellen</button>
            </div>
          </form>
          <div id="day-list"></div>
        </section>

        <section class="card wide">
          <h2>Workout-Modus</h2>
          <div class="workout-header">
            <label for="day-select">Tag auswählen</label>
            <select id="day-select"></select>
          </div>
          <div id="workout-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
